<!-- Args:
  - path = path to image relative to "assets/images/blog".
  - class = css classes applied to all "source" and "img" elements.
  - dimensions = See https://gohugo.io/content-management/image-processing/#resize
  - alt = Alt text
 -->
{{- $image := resources.Get (path.Join "images" "blog" .Page.File.BaseFileName (.Get "path")) -}}
{{- $image := $image.Resize (.Get "dimensions") -}}
<picture>
	<source class='{{- (.Get "class") -}}' srcset='{{- ($image.Process "webp").RelPermalink -}}' type="image/webp" width='{{- $image.Width -}}' height='{{- $image.Height -}}'>
	<source class='{{- (.Get "class") -}}' srcset='{{- ($image.Process "jpeg").RelPermalink -}}' type="image/jpeg" width='{{- $image.Width -}}' height='{{- $image.Height -}}'>
	<img class='{{- (.Get "class") -}}' src='{{- ($image.Process "png").RelPermalink -}}' alt='{{- (.Get "alt") | markdownify -}}' width='{{- $image.Width -}}' height='{{- $image.Height -}}'>
</picture>
